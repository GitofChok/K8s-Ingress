# ConfigMap api-files สร้างจากโฟลเดอร์ app-api ด้วย deploy.sh
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-api
  namespace: id-594
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-api
  template:
    metadata:
      labels:
        app: app-api
    spec:
      containers:
      - name: python
        image: python:3.12-alpine
        command: ["python", "-u", "/app/app.py"]
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: code
          mountPath: /app
      volumes:
      - name: code
        configMap:
          name: api-files
---
apiVersion: v1
kind: Service
metadata:
  name: app-api
  namespace: id-594
spec:
  selector:
    app: app-api
  ports:
  - port: 80
    targetPort: 8080
