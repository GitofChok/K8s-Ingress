# ConfigMap about-files สร้างจากโฟลเดอร์ app-about ด้วย deploy.sh
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-about
  namespace: id-594
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-about
  template:
    metadata:
      labels:
        app: app-about
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
        - name: conf
          mountPath: /etc/nginx/conf.d
      volumes:
      - name: html
        configMap:
          name: about-files
          items:
          - key: index.html
            path: index.html
          - key: about.html
            path: about.html
          - key: photo.png
            path: about/photo.png
      - name: conf
        configMap:
          name: about-files
          items:
          - key: default.conf
            path: default.conf
---
apiVersion: v1
kind: Service
metadata:
  name: app-about
  namespace: id-594
spec:
  selector:
    app: app-about
  ports:
  - port: 80
    targetPort: 80
