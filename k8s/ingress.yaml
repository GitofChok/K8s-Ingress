apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: www-ingress
  namespace: id-594
spec:
  ingressClassName: nginx
  rules:
  - host: www.id-594.com
    http:
      paths:
      - path: /about
        pathType: Prefix
        backend:
          service:
            name: app-about
            port:
              number: 80
      - path: /research
        pathType: Prefix
        backend:
          service:
            name: app-research
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: app-api
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: app-about
            port:
              number: 80
---
# admin.id-594.com เข้ามาที่ / แล้วให้ redirect ไป /edit ของ app-research
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: admin-ingress
  namespace: id-594
  annotations:
    nginx.ingress.kubernetes.io/app-root: /edit
spec:
  ingressClassName: nginx
  rules:
  - host: admin.id-594.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: app-research
            port:
              number: 80
